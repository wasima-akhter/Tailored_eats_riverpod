name: tailored_eats_riverpod
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

# ============================================================
# Dependencies
# ============================================================
dependencies:
  flutter:
    sdk: flutter

  # ----------------------------------------------------------
  # Flutter / Platform
  # ----------------------------------------------------------
  cupertino_icons: ^1.0.8

  # ----------------------------------------------------------
  # State Management
  # ----------------------------------------------------------
  flutter_riverpod: ^2.6.1

  # ----------------------------------------------------------
  # Navigation
  # ----------------------------------------------------------
  go_router: ^18.0.0

  # ----------------------------------------------------------
  # Networking
  # ----------------------------------------------------------
  dio: ^5.11.0
  connectivity_plus: ^7.3.1

  # ----------------------------------------------------------
  # Local Storage
  # ----------------------------------------------------------
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0

  # ----------------------------------------------------------
  # Local Database
  # ----------------------------------------------------------
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.34

  # ----------------------------------------------------------
  # UI / Layout
  # ----------------------------------------------------------
  flutter_screenutil: ^5.9.3
  shimmer: ^4.0.0
  cached_network_image: ^4.0.0

# ============================================================
# Dev Dependencies
# ============================================================
dev_dependencies:
  # ----------------------------------------------------------
  # Testing
  # ----------------------------------------------------------
  flutter_test:
    sdk: flutter

  # ----------------------------------------------------------
  # Linting
  # ----------------------------------------------------------
  flutter_lints: ^6.0.0

  # ----------------------------------------------------------
  # Code Generation
  # ----------------------------------------------------------
  build_runner: ^2.4.15
  flutter_gen_runner: ^5.9.0

  # Drift code generation
  drift_dev: ^2.28.0

# ============================================================
# FlutterGen Configuration
# ============================================================
flutter_gen:
  output: lib/core/assets/

  line_length: 80

  # integrations:
  #   flutter_svg: true

# ============================================================
# Flutter Configuration
# ============================================================
flutter:
  uses-material-design: true

  # ----------------------------------------------------------
  # Assets
  # ----------------------------------------------------------
  assets:
    - assets/icons/
    - assets/images/
    - assets/images/onboarding/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/manrope/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/manrope/Manrope-ExtraBold.ttf
          weight: 800
